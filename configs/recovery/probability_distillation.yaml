schema_version: 1

base:
  ternary_weights_frozen: true
  task_adapted_before_ternary: true
  decision_adapter_merged_before_ternary: true
  separate_decision_adapter_at_runtime: false

recovery:
  method: lora
  precision: bf16
  rank: 16
  alpha: 32
  # Resolve exact module paths from the loaded task-adapted ternary architecture.
  # Do not guess architecture module names in config.
  target_modules: []

teacher_signal:
  type: option_logits
  cache_scope: single_decision_position_options_only
  canonical_storage_dtype: fp16
  store_option_logits: true
  store_option_token_ids: true
  store_option_probabilities: true
  store_target: true
  store_temperature_metadata: true
  store_full_vocabulary_logits: false
  optional_full_vocabulary:
    enabled: false
    purpose: diagnostics_only
    hard_gate: Enable only for an explicit experiment showing value beyond option-logit distillation.

loss:
  option_kl: 1.0
  cross_entropy: 0.2
  brier: 0.2
  full_vocab_kl: 0.0

notes:
  - The high-precision Decision Teacher provides the reference option logits.
  - Cache only option logits by default; full-vocabulary logits are not required for recovery.
  - Merge the Decision LoRA into the task-adapted quantization source before ternary conversion.
  - The final runtime stack is the task-adapted ternary base plus one Recovery LoRA.
