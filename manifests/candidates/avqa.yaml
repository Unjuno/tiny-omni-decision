  revision_field_semantics: >-
    SHA-1 of the exact fetched AVQA HTML metadata page, used only because the
    manifest schema requires a 40-hex revision; upstream dataset revision is
    unknown and this is not a data release revision.
  download_link: >-
    Official AVQA page's SharePoint link redirected to Microsoft sign-in;
    no access was requested or accepted and no data files were fetched.
  task_scope: >-
    Official page defines question_relation values View, Sound, and Both and
    gives an example that requires relating audio and visual evidence. This is
    a promising task shape, not verified instance-level complementarity.
  split_limitation: >-
    The page describes YouTube ID, timestamp, and train/test metadata but no
    source-video grouping audit was performed. It calls val_qa.json test
    annotations; keep them closed during development.
  rights_limitation: >-
    AVQA's posted permission notice is limited to personal/classroom copies
    and requires honoring third-party copyrights; it does not clearly grant
    model-training rights. VGG-Sound states original video owners retain
    copyright and current download links are unavailable. Source remains
    REVIEW and is excluded from every catalog.
