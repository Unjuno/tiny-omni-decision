  official_page_describes: >-
    More than 10K untrimmed videos, more than 30K audio-visual events, 100
    categories, and event temporal boundaries. Raw-video CSV rows contain
    YouTube ID, start/end seconds, and train/validation/test split.
  license_limitation: >-
    Official page states the dataset is CC BY 4.0 for commercial/research use,
    while also stating copyright remains with original video owners. The
    Hugging Face mirror advertises CC BY-NC-SA 4.0, a conflicting grant; that
    mirror is excluded. No per-source YouTube license audit was performed, so
    source media remains REVIEW and must not be fetched or used until its
    rights and source identity are checked.
  excluded_mirror:
    url: https://huggingface.co/datasets/ttgeng233/UnAV-100
    advertised_license: CC-BY-NC-SA-4.0
    used: false
  availability_limitation: >-
    Official annotations/features are linked through Baidu Drive; this audit
    did not fetch them. No archive hash, file-level revision, media, or
    annotations were verified locally. The code repository commit is not a
    data revision.
  proposed_task_scope: >-
    Candidate for audio-video event-presence or temporal-localization decisions;
    not a general free-form audiovisual QA benchmark. Do not include in a
    training/evaluation catalog while source rights and split identity remain
    unresolved.
