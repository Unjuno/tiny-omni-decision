  train_audit_script: scripts/audit_ava_active_speaker_train_labels.py
  train_audit_result: C:/CodexArtifacts/pretrained-reuse-r2/ava-activespeaker-label-screen-01/train-label-audit.json
  source_identity_grouping: >-
    Official documentation says the label split follows AVA Actions and provides a
    per-video CSV with a within-video entity_id. The official train label archive has
    120 video members, but no safe validation archive is currently established. The
    archive linked as validation contains internal test-named members, and one of its
    labels was inadvertently observed; treat it as contaminated and never use it for
    model selection or evaluation. Train/validation video-ID disjointness, exact content
    overlap and actor/site grouping remain unverified.
  license_limitation: >-
    Google Research labels the AVA datasets CC BY 4.0. Only the official TRAIN and
    validation-link annotation archives were downloaded; no audio/video media was
    fetched. The validation-link archive is quarantined as described above. The
    referenced media are original YouTube movie/video assets; the relationship between
    the dataset-level statement and rights in each underlying recording remains
    unresolved. Keep media PER-SOURCE/REVIEW and do not use media until source-level
    rights are established.
  proposed_task_scope: >-
    Candidate for active-speaker association: given a synchronized video segment,
    audio window, and an externally supplied face-track proposal, score whether that
    candidate is speaking and audible. This is a bounded AV component task, not general
    audiovisual reasoning. Supplied face boxes make it an oracle-proposal evaluation;
    any detector/proposal cost must be counted separately. Avoid identity recognition.
  leakage_and_audit_controls: >-
    Use only official train/validation annotations after media rights clearance;
    never open challenge/test labels for iteration. Group by video and any verified
    source/person identity, hash split contents, and check exact/normalized overlap.
    Predefine class-balanced and per-video metrics plus audio-only, video-only, joint,
    missing, swapped and timestamp-offset controls. Existing results from this source
    have not been observed in this project.
