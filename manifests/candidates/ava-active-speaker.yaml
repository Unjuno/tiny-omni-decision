notes:
  official_page_checked: "2026-10-18"
  pinned_reference_commit: >-
    cvdfoundation/ava-dataset@70340626184cbde175cb1359bdf5af6f75e28231 pins the
    public download instructions only; it is not a label/media archive revision.
  annotation_release_urls:
    train: https://research.google.com/ava/download/ava_activespeaker_train_v1.0.tar.bz2
    validation: https://research.google.com/ava/download/ava_activespeaker_val_v1.0.tar.bz2
  label_fields: [SPEAKING_AND_AUDIBLE, SPEAKING_BUT_NOT_AUDIBLE, NOT_SPEAKING]
  upstream_data_revision: UNKNOWN
  local_archive_hashes: UNKNOWN
  source_identity_grouping: >-
    Official documentation says the label split follows AVA Actions and provides a
    per-video CSV with a within-video entity_id. Train/validation video-ID disjointness,
    exact content overlap and actor/site grouping have not been checked from downloaded
    annotations. Do not claim independent groups until those checks pass.
  license_limitation: >-
    Google Research labels the AVA datasets CC BY 4.0. The referenced media are
    original YouTube movie/video assets; the relationship between that dataset-level
    statement and rights in each underlying recording has not been resolved. No video,
    audio or annotation archive was downloaded. Keep media PER-SOURCE/REVIEW and do not
    use any media until source-level rights are established.
  proposed_task_scope: >-
    Candidate for active-speaker association: given a synchronized video segment,
    audio window, and an externally supplied face-track proposal, score whether that
    candidate is speaking and audible. This is a bounded AV component task, not general
    audiovisual reasoning. Supplied face boxes make it an oracle-proposal evaluation;
    any detector/proposal cost must be counted separately. Avoid identity recognition.
  leakage_and_audit_controls: >-
    Use only official train/validation annotations after media rights clearance;
    never open challenge/test labels for iteration. Group by video and any verified
    source/person identity, hash split contents, and check exact/normalized overlap.
    Predefine class-balanced and per-video metrics plus audio-only, video-only, joint,
    missing, swapped and timestamp-offset controls. Existing results from this source
    have not been observed in this project.
