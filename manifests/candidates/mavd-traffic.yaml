  split_audit: >-
    Official TRAIN has 24 annotation files, VALIDATION 7, and TEST 16. TRAIN
    and VALIDATION share three conservative site-day groups; TRAIN and
    VALIDATION files also come only from the Rivera site, while TEST file names
    identify three other sites. Test label contents were not read. The official
    development split is not independent under site-day grouping and must not
    be used for model selection without a new grouped split.
  label_scope: >-
    Audio event intervals use a hierarchical traffic ontology and may overlap.
    The dataset does not provide an independently verified visual object/event
    label for each audio interval in the base MAVD-traffic record. Audio/video
    presence alone does not establish a both-required Decision task.
