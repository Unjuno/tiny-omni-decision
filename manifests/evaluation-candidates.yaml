schema_version: 1
manifest_type: candidate_catalog
purpose: evaluation
sources:
  - manifest: candidates/csqa2-dev.yaml
    include: true
    adapter: csqa2
    note: Official development split used for selection; not a blind audit.
  - manifest: candidates/typed-synth-validation.yaml
    include: true
    adapter: typed-decisions-synth
  - manifest: candidates/clevr4-validation.yaml
    include: true
    adapter: clevr4
  - manifest: candidates/speech-commands-test.yaml
    include: true
    adapter: speech-commands
  - manifest: candidates/librispeech-dev-clean.yaml
    include: true
    adapter: librispeech-hard-negatives
  - manifest: candidates/clevrer-validation.yaml
    include: true
    adapter: clevrer
  - manifest: candidates/open-jev-test.yaml
    include: true
    adapter: open-jev
  - manifest: candidates/mmau-test-mini.yaml
    include: true
    adapter: mmau
    note: Evaluation-only metadata; non-commercial license and media redistribution denial apply.
  - manifest: candidates/mvbench.yaml
    include: true
    adapter: mvbench
    note: Evaluation-only; only third-party videos under research terms.
  - manifest: candidates/onejev.yaml
    include: false
    reason: Aggregate has only a train split and is itself training data; avoid evaluation leakage.
