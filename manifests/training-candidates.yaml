schema_version: 1
manifest_type: candidate_catalog
purpose: training
sources:
  - manifest: candidates/typed-synth-validation.yaml
    include: false
    reason: evaluation split is held out
  - manifest: dataset.example.yaml
    subset: default
    split: train
    adapter: typed-decisions-synth
    include: true
    row_limit: null
  - manifest: candidates/open-jev.yaml
    subset: release-v2-redistributable
    split: train
    adapter: open-jev
    include: true
    note: Only hard single-winner labels are accepted; audit output retains original soft targets.
  - manifest: candidates/clevr4.yaml
    subset: clevr_4_10k_v1
    split: train
    adapter: clevr4
    include: true
    note: Synthetic image taxonomy classification; CC BY 4.0, attributed, no images copied.
  - manifest: candidates/speech-commands.yaml
    subset: v0.02
    split: train
    adapter: speech-commands
    include: true
    note: Ten CC BY 4.0 keyword classes only; anonymous audio references, no speaker identification.
  - manifest: candidates/clevrer.yaml
    subset: official-2020
    split: train
    adapter: clevrer
    include: true
    note: Synthetic video under CC0; descriptive single-answer questions only, video bytes stay upstream.
  - manifest: candidates/onejev.yaml
    include: false
    reason: per-source license audit is REVIEW; no rows enter training until rights are explicit.
