[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tiny-omni-decision"
version = "0.1.0.dev0"
description = "Extreme-low-bit multimodal decision models with ternary compression and calibration recovery."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Unjuno" }]
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
ml = [
  "torch>=2.5,<2.6",
  "torchvision>=0.20,<0.21",
  "transformers>=5.6.2,<5.7",
  "peft>=0.21.2,<0.22",
  "accelerate>=1.10,<2",
  "datasets>=4,<5",
  "safetensors>=0.6,<1",
  "huggingface-hub>=0.35,<2",
]

[project.scripts]
tiny-omni-decision = "tiny_omni_decision.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tiny_omni_decision"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
