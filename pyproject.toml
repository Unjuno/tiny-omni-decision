[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tiny-omni-decision"
version = "0.1.0.dev0"
description = "Extreme-low-bit multimodal decision models with ternary compression and calibration recovery."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Unjuno" }]
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.15,<1",
  "click>=8.1,<9",
  "rich>=13.9,<15",
]

[project.optional-dependencies]
dev = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "pytest>=8.3,<9",
  "requests>=2.32,<3",
  "ruff>=0.9,<1",
]
ml = [
  "torch>=2.6,<2.7",
  "torchvision>=0.21,<0.22",
  "transformers>=5.6.2,<5.7",
  "peft>=0.21.2,<0.22",
  "accelerate>=1.10,<2",
  "av>=14,<19",
  "safetensors>=0.6,<1",
  "huggingface-hub>=0.35,<2",
]
data = ["datasets>=4,<5"]

[project.scripts]
tiny-omni-decision = "tiny_omni_decision.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tiny_omni_decision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Preserve the hash-bound executed first publisher; v2 fixes explicit zip length checks.
[tool.ruff.lint.per-file-ignores]
"scripts/report_lombard_correspondence.py" = ["B905"]
# Retain physically hash-bound executed correction and its original literal fixture.
"scripts/correct_native_av_publication.py" = ["E501"]
"tests/test_native_av_reference_correction.py" = ["E501"]
