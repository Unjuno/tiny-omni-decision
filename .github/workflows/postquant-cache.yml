name: postquant-cache
on:
  pull_request:
    paths:
      - 'src/tiny_omni_decision/teacher_cache.py'
      - 'src/tiny_omni_decision/postquant_cache.py'
      - 'scripts/prepare_postquant_cache.py'
      - 'tests/test_teacher_cache.py'
      - '.github/workflows/postquant-cache.yml'
permissions:
  contents: read
jobs:
  cache-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner only
        run: python -m pip install "pytest>=8.3,<9"
      - name: Synthetic JSON contracts (no model or GPU)
        run: python -m pytest tests/test_teacher_cache.py -q
      - name: Read-only CLI help
        run: python scripts/prepare_postquant_cache.py --help
