name: Student QAT CPU regression

on:
  push:
    branches:
      - fix/student-qat-training-handoff
  pull_request:
    paths:
      - "src/tiny_omni_decision/ternary.py"
      - "src/tiny_omni_decision/student_training.py"
      - "scripts/train_student_ternary_qat.py"
      - "tests/test_student_ternary.py"
      - "tests/test_student_training.py"
      - ".github/workflows/qat-regression.yml"

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" safetensors "numpy>=1.26,<3"
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest tests/test_student_ternary.py tests/test_student_training.py tests/test_ternary_workspace.py -q
