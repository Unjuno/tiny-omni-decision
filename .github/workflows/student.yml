name: Student CPU reference checks
on:
  pull_request:
  push:
    branches: [main, 'feat/ternary-student-recovery']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'safetensors>=0.6,<1' 'numpy>=1.26,<3'
      - run: ruff check . || { ruff check --diff .; exit 1; }
      - if: always()
        run: pytest -q
      - run: python -m tiny_omni_decision.student smoke --output artifacts/ci-student-smoke
