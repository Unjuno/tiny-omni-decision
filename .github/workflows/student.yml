name: Student CPU reference checks
on:
  pull_request:
  push:
    branches: [main, 'feat/ternary-student-recovery']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-student.txt
      - name: Verify PyTorch media stack
        run: |
          python - <<'PY'
          import torch
          import torchaudio
          import torchvision
          assert torch.__version__.split("+")[0].startswith("2.6.")
          assert torchvision.__version__.split("+")[0].startswith("0.21.")
          assert torchaudio.__version__.split("+")[0].startswith("2.6.")
          print(torch.__version__, torchvision.__version__, torchaudio.__version__)
          PY
      - run: ruff check . || { ruff check --diff .; exit 1; }
      - if: always()
        run: pytest -q
      - run: python -m tiny_omni_decision.student smoke --output artifacts/ci-student-smoke
