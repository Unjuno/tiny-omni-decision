name: postquant-numerics
on:
  pull_request:
    paths:
      - 'src/tiny_omni_decision/postquant_*.py'
      - 'src/tiny_omni_decision/ternary_reference.py'
      - 'scripts/check_postquant_numerics.py'
      - 'tests/test_postquant_*.py'
      - 'tests/test_ternary_reference.py'
      - 'configs/recovery/decision_respecialization_v2.example.yaml'
      - '.github/workflows/postquant-numerics.yml'
permissions:
  contents: read
jobs:
  numerical-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install ".[dev]"
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Numerical tests (synthetic tensors only)
        run: python -m pytest tests/test_postquant_policy.py tests/test_postquant_loss.py tests/test_ternary_reference.py tests/test_postquant_check.py tests/test_postquant_launch.py -q
      - name: Standalone CPU numerical check (no optimizer updates)
        run: python scripts/check_postquant_numerics.py --policy configs/recovery/decision_respecialization_v2.example.yaml --check-numerics
