name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Validate manifests
        run: |
          tiny-omni-decision validate-model-manifest manifests/base-model.example.yaml
          for manifest in manifests/dataset.example.yaml manifests/candidates/*.yaml; do
            tiny-omni-decision validate-dataset-manifest "$manifest"
          done
          tiny-omni-decision validate-dataset-catalog manifests/training-candidates.yaml
          tiny-omni-decision validate-dataset-catalog manifests/evaluation-candidates.yaml
          tiny-omni-decision audit-dataset-manifest manifests/dataset.example.yaml
