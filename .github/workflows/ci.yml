name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Install CPU training-test dependencies
        run: |
          python -m pip install "torch==2.6.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "safetensors>=0.6,<1"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Validate manifests
        run: |
          python -m json.tool manifests/pretrained_reuse/closed-public-test-audits.json > /dev/null
          python -m json.tool manifests/pretrained_reuse/uci-har-sensor-v1.json > /dev/null
          tiny-omni-decision validate-model-manifest manifests/base-model.example.yaml
          for manifest in manifests/dataset.example.yaml manifests/candidates/*.yaml; do
            tiny-omni-decision validate-dataset-manifest "$manifest"
          done
          tiny-omni-decision validate-dataset-catalog manifests/training-candidates.yaml
          tiny-omni-decision validate-dataset-catalog manifests/evaluation-candidates.yaml
          tiny-omni-decision validate-dataset-catalog manifests/durable-training-corpus.yaml
          tiny-omni-decision validate-dataset-catalog manifests/durable-heldout-corpus.yaml
          tiny-omni-decision audit-dataset-manifest manifests/dataset.example.yaml
